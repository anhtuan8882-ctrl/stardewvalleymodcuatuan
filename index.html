<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 câu hỏi & Vòng quay may mắn của anh Tún</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Chakra Petch', Arial, sans-serif;
            background-color: #05070e;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.14), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 42, 95, 0.14), transparent 40%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 10px),
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 35px 35px, 35px 35px;
            background-attachment: fixed;
            color: #ffffff;
            text-align: center;
            padding: 25px 15px 75px;
            margin: 0;
            overflow-x: hidden;
        }

        /* Thanh trạng thái Game (HUD) */
        .game-hud {
            max-width: 600px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.15), rgba(13, 18, 36, 0.95), rgba(255, 42, 95, 0.15));
            border-top: 2px solid #00f3ff;
            border-bottom: 2px solid #ff2a5f;
            padding: 12px 24px;
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            font-size: 15px;
            letter-spacing: 1.5px;
        }
        .hud-badge {
            color: #00f3ff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        .hud-score {
            color: #ffea00;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.8);
        }

        /* Tiêu đề chính */
        h1 {
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff2a5f, 0 0 25px #ff2a5f;
            margin-bottom: 22px;
        }

        /* Khung Ảnh 1 */
        .avatar-frame {
            display: inline-block;
            padding: 5px;
            background: linear-gradient(135deg, #00f3ff, #ff2a5f);
            clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
            margin-bottom: 32px;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.45));
        }
        .main-img {
            display: block;
            width: 220px;
            clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 15px 100%, 0 calc(100% - 15px), 0 15px);
        }

        /* Danh sách 5 câu hỏi */
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .question-card-border {
            padding: 2px;
            background: linear-gradient(135deg, #00f3ff 0%, #1d2b64 50%, #ff2a5f 100%);
            clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.8));
        }

        .question-card {
            background: linear-gradient(160deg, #0c1124, #070914);
            padding: 22px;
            text-align: left;
            clip-path: polygon(0 0, calc(100% - 21px) 0, 100% 21px, 100% 100%, 21px 100%, 0 calc(100% - 21px));
            position: relative;
        }

        .quest-label {
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
            color: #05070e;
            background: #00f3ff;
            padding: 3px 12px;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .question-title {
            font-size: 18px;
            font-weight: bold;
            color: #f4f7ff;
            margin-top: 0;
            margin-bottom: 18px;
        }

        .options {
            display: flex;
            gap: 14px;
        }

        .opt-btn {
            flex: 1;
            position: relative;
            overflow: hidden;
            padding: 15px 18px;
            font-family: 'Chakra Petch', Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(180deg, #162044, #0d132b);
            color: #ffffff;
            border: 1px solid #3c54a8;
            border-left: 4px solid #00f3ff;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .opt-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.65), rgba(0, 243, 255, 0.4), transparent);
            transform: skewX(-25deg);
        }

        .opt-btn:hover:not(:disabled)::before,
        .opt-btn.sparkle-active::before {
            animation: shineSweep 0.65s ease-out;
        }

        @keyframes shineSweep {
            0% { left: -120%; }
            100% { left: 160%; }
        }

        .opt-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #1f2e61, #131c3d);
            border-color: #00f3ff;
            transform: translateY(-2px);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
        }

        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .opt-btn.correct {
            opacity: 1 !important;
            color: #00ff88;
            border-color: #00ff88;
            border-left-color: #00ff88;
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.28), rgba(0, 120, 65, 0.25));
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.9);
        }
        .opt-btn.correct::after {
            content: " ✔";
            font-size: 18px;
            float: right;
        }

        .opt-btn.wrong {
            opacity: 1 !important;
            color: #ff2a5f;
            border-color: #ff2a5f;
            border-left-color: #ff2a5f;
            background: linear-gradient(180deg, rgba(255, 42, 95, 0.3), rgba(130, 15, 45, 0.25));
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.9);
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            50% { transform: translateX(7px); }
            75% { transform: translateX(-4px); }
        }

        /* --- PHẦN VÒNG QUAY MAY MẮN RỰC RỠ --- */
        .lucky-wheel-section {
            max-width: 600px;
            margin: 40px auto 0;
            padding: 3px;
            background: linear-gradient(135deg, #ffea00, #ff2a5f, #00f3ff);
            clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
            filter: drop-shadow(0 0 20px rgba(255, 234, 0, 0.4));
        }

        .lucky-wheel-container {
            background: linear-gradient(160deg, #0f122b, #050712);
            padding: 25px;
            clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 23px, 100% 100%, 23px 100%, 0 calc(100% - 23px));
            text-align: center;
        }

        .wheel-title {
            color: #ffea00;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.7);
        }

        .wheel-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
        }

        /* Mũi tên chỉ hướng quay */
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffea00;
            z-index: 20;
            filter: drop-shadow(0 0 8px #ff2a5f);
        }

        #canvasWheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transition: transform 4s cubic-bezier(0.15, 0.8, 0.15, 1);
        }

        .spin-btn {
            background: linear-gradient(135deg, #ffea00, #ff7700);
            color: #05070e;
            font-family: 'Chakra Petch', Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 35px;
            border: none;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.6);
            transition: all 0.2s;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 0 25px rgba(255, 234, 0, 0.9);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Bảng Popup kết quả vòng quay rực rỡ */
        #rewardPopup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 10
